[project]
name = "redraw"
version = "0.3.1"
description = "Handwritten Meitei Mayek recognition with a network that redraws the characters it reads"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.setuptools]
packages = ["redraw"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
